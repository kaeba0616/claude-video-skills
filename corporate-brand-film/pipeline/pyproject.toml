[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-generator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "google-genai>=1.0", "requests>=2.31"]

[tool.setuptools]
packages = ["src", "src.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
